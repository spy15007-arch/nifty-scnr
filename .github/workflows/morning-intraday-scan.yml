name: Morning Intraday Scan

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Limit scan to N symbols for testing'
        required: false
        default: ''
  schedule:
    # 08:30 IST weekdays = 03:00 UTC. (Updated cron to exactly match your comment intent 30 3)
    # With a 2-minute runtime, this delivers pristine alerts to you at 08:32 AM IST.
    - cron: '30 3 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # <--- Tightened from 40m down to 5m to protect runner execution limits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so git pull/rebase works flawlessly

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # <--- Speeds up dependency installs dramatically on morning runs

      # --- ADVANCED BROKER CACHING SYSTEM ---
      # Crucial for pre-market: reuses the structural token definitions instead of querying Angel master
      - name: Cache Broker Instrument Master Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/angelone
            ./data/*.json
            ./data/*.pkl
          key: angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-${{ github.run_id }}
          restore-keys: |
            angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-
            angelone-instruments-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intraday-focused stock scan
        env:
          TRADING_BROKER: angelone
          TRADING_TEST_LIMIT: ${{ inputs.test_limit }}
          TRADING_MAX_UNIVERSE: '500'
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UV_THREADPOOL_SIZE: "64" # <--- Forces low-level networking engines to run concurrently
        run: python main.py scan

      - name: Run index options scan (CE + PE)
        env:
          TRADING_BROKER: angelone
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UV_THREADPOOL_SIZE: "64"
        run: python main.py options

      # --- FIXES CONCURRENT RUN REJECTIONS IN GIT ---
      - name: Sync and Commit reports back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/output/*.md || true
          
          # Only proceed to sync and push if changes actually exist locally
          if ! git diff --cached --quiet; then
            git commit -m "Morning intraday scan $(date -u +%Y-%m-%d) [skip ci]"
            git fetch origin main
            git pull origin main --rebase # <--- Resolves the push failure by rebasing on top of remote main
            git push origin HEAD:main
          else
            echo "No pipeline data report updates detected."
          fi
