name: Swing Scan

# HOW THIS STARTS:
#   1. EXTERNAL TIMER (recommended) - cron-job.org calls GitHub at 4:05 PM IST on weekdays (docs/TIMER_SETUP.md).
#   2. The "Run workflow" button (source = manual) - always runs.
#   3. GitHub's own cron below - a fallback. Being late is fine for this scan (it reads the day's final candles);
#      the program skips it only when this session's Swing scan has already been sent.
#
# This is the FULL-MARKET run. Besides the Swing picks it saves the ~100-stock watchlist that tomorrow's
# afternoon BTST scan re-checks (data_cache/btst_watchlist.json) and refreshes the delivery-% data.

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Limit scan to N symbols for testing'
        required: false
        default: ''
      source:
        description: 'Where this run comes from (leave as manual; the external timer sends "timer")'
        required: false
        type: choice
        options:
          - manual
          - timer
        default: manual
  schedule:
    - cron: '30 10 * * 1-5'   # 4:00 PM IST fallback

concurrency:
  group: scan-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: 'Asia/Kolkata'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Broker Instrument Master Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/angelone
            ./data/*.json
            ./data/*.pkl
          key: angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-${{ github.run_id }}
          restore-keys: |
            angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-
            angelone-instruments-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run swing scan
        env:
          TRADING_RUN_SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.source || 'manual' }}
          TRADING_TEST_LIMIT: ${{ inputs.test_limit }}
          TRADING_CAPITAL_INR: ${{ vars.TRADING_CAPITAL_INR }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py scan_swing

      - name: Commit Swing reports, scoreboard and data cache
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reports/swing/ reports/output/ tracking/ data_cache/ scan_results_swing.csv summary.md summary_swing.md
          if ! git diff --cached --quiet; then
            git commit -m "Automated Swing scan update $(date -u +%Y-%m-%d)" || echo "No changes to commit"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git merge origin/main --no-edit -X ours -m "Merge remote changes" || true
              if git push origin HEAD:main; then break; fi
              echo "Push attempt $attempt failed - retrying"
              sleep $((attempt * 4))
            done
          else
            echo "No new updates detected for the Swing session."
          fi
