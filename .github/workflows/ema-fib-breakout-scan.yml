name: EMA-Fib Breakout Scan

on:
  workflow_dispatch: {}
  schedule:
    # 09:20 IST daily on weekdays = 03:50 UTC. Adjust to match when you
    # want it to run relative to NSE market open (09:15 IST).
    - cron: '50 3 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run breakout scan
        env:
          TRADING_BROKER: angelone
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          GROWW_API_KEY: ${{ secrets.GROWW_API_KEY }}
          GROWW_API_SECRET: ${{ secrets.GROWW_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING_CROSS_CHECK_BROKER: ""
        run: python main.py scan

      - name: Commit report back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/output/*.md || true
          git commit -m "Automated scan report $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
