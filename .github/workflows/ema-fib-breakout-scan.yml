name: EOD Swing Scan (Full Universe)

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Limit scan to N symbols for testing (leave blank for full ~1500-symbol universe)'
        required: false
        default: ''
  schedule:
    # 16:00 IST weekdays = 10:30 UTC. Runs AFTER market close - not
    # time-critical, so it gets the full ~1500-symbol universe.
    - cron: '30 10 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full-universe swing scan
        env:
          TRADING_BROKER: angelone
          TRADING_TEST_LIMIT: ${{ inputs.test_limit }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py scan

      - name: Commit report back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f reports/output/*.md || true
          git commit -m "EOD swing scan $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
