name: EOD Swing Scan (Full Universe)

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Limit scan to N symbols for testing'
        required: false
        default: ''
  schedule:
    # 16:00 IST weekdays = 10:30 UTC. Runs AFTER market close.
    - cron: '30 10 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Broker Instrument Master Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/angelone
            ./data/*.json
            ./data/*.pkl
          key: angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-${{ github.run_id }}
          restore-keys: |
            angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-
            angelone-instruments-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full-universe EOD swing scan
        env:
          TRADING_BROKER: angelone
          TRADING_TEST_LIMIT: ${{ inputs.test_limit }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py scan_eod

      - name: Sync and Commit report back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add -A reports/eod/*.md || true
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated scan update $(date -u +%Y-%m-%d)" || echo "No changes to commit"
            git fetch origin main
            git merge origin/main --no-edit -X ours -m "Merge remote changes" || true
            git push origin HEAD:main
          else
            echo "No new updates detected for the EOD session."
          fi
