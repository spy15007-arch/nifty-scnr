name: EOD Swing Scan (Full Universe)

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Limit scan to N symbols for testing (leave blank for full ~1500-symbol universe)'
        required: false
        default: ''
  schedule:
    # 16:00 IST weekdays = 10:30 UTC. Runs AFTER market close - not
    # time-critical, so it gets the full ~1500-symbol universe.
    - cron: '30 10 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # <--- Drastically tightened from 90m down to 10m to catch hung tasks early
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so git pull/rebase works flawlessly

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # <--- Caches pip dependencies instantly across action runs

      # --- ADVANCED BROKER CACHING SYSTEM ---
      # Crucial for 1,500 symbols: Prevents the runner from downloading massive token files on every run
      - name: Cache Broker Instrument Master Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/angelone
            ./data/*.json
            ./data/*.pkl
          key: angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-${{ github.run_id }}
          restore-keys: |
            angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-
            angelone-instruments-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full-universe swing scan
        env:
          TRADING_BROKER: angelone
          TRADING_TEST_LIMIT: ${{ inputs.test_limit }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ENVIRONMENT VARIABLE INJECTION: Forces execution libraries to process multi-threading tasks efficiently
          UV_THREADPOOL_SIZE: "64"
        run: python main.py scan

      # --- STRUCTURAL FIX FOR REJECTED REMOTE COMMIT PUSHES ---
      - name: Sync and Commit report back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/output/*.md || true
          
          # Only proceed to sync and push if changes actually exist locally
          if ! git diff --cached --quiet; then
            git commit -m "EOD swing scan $(date -u +%Y-%m-%d) [skip ci]"
            git fetch origin main
            git pull origin main --rebase # <--- Pulls down remote modifications to prevent push failure
            git push origin HEAD:main
          else
            echo "No pipeline data report updates detected."
          fi
