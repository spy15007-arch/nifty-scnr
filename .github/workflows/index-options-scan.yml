name: Index Options Scan (Manual)

# Manual-only (no `schedule:`) - split out on 2026-10-15 after removing
# this scan from the daily BTST workflow and from run_all, since the
# Angel One index-instrument fetch has never been reliable (regularly
# "all fetches failed") and the daily auto-run wasn't wanted. This
# keeps a one-click way to check NIFTY/BANKNIFTY/FINNIFTY options from
# the Actions tab whenever you actually want to, without it pinging
# Telegram on a schedule you're not watching.

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: 'Asia/Kolkata'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Broker Instrument Master Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/angelone
            ./data/*.json
            ./data/*.pkl
          key: angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-${{ github.run_id }}
          restore-keys: |
            angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-
            angelone-instruments-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run index options scan (CE + PE)
        env:
          TRADING_BROKER: angelone
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py options

      - name: Commit options report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reports/output/
          if ! git diff --cached --quiet; then
            git commit -m "Manual index options scan $(date -u +%Y-%m-%d)" || echo "No changes to commit"
            git fetch origin main
            git merge origin/main --no-edit -X ours -m "Merge remote changes" || true
            git push origin HEAD:main
          else
            echo "No report changes to commit."
          fi
