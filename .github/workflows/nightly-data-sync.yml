name: Nightly Market Data Sync

on:
  schedule:
    # Runs at 17:30 IST (12:00 UTC) Monday-Friday after market close
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and Cache Historical Universe Bars
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          python -c "
          from data.universe import load_universe
          from data.historical import AngelOneHistoricalStore, ParquetStore
          import time
          
          universe = load_universe()
          live_client = AngelOneHistoricalStore()
          local_db = ParquetStore(root='./market_data')
          
          print('📥 Backing up 500 stock records to disk database...')
          for i, sym in enumerate(universe, 1):
              try:
                  time.sleep(0.45)
                  df = live_client.get_bars(sym, lookback_days=250)
                  if df is not None and not df.empty:
                      local_db.save_bars(sym, df)
              except Exception as e:
                  if 'ab1021' in str(e).lower() or 'rate' in str(e).lower() or 'too many' in str(e).lower():
                      print(f'⚠️ Session limit friction on {sym}. Engaging 5-second structural freeze...')
                      time.sleep(5.0)
                      try:
                          df_retry = live_client.get_bars(sym, lookback_days=250)
                          if df_retry is not None and not df_retry.empty:
                              local_db.save_bars(sym, df_retry)
                      except Exception:
                          pass
                  pass
              if i % 50 == 0 or i == len(universe):
                  print(f'📋 Database sync checkpoint: {i}/{len(universe)} symbols processed.')
          print('✓ Local Database backup sequence complete!')
          "

      - name: Commit cached Parquet data back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data/*.parquet || true
          if ! git diff --cached --quiet; then
            git commit -m "database: sync historical candles [skip ci]"
            git fetch origin main
            git pull origin main --rebase
            git push origin HEAD:main
          else
            echo "No data modifications detected in the market pool data assets."
          fi
