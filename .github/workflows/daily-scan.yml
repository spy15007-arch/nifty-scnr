name: Daily India Momentum Scan

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit results back to repo
        run: |
          git config --global user.name "scanner-bot"
          git config --global user.email "scanner-bot@users.noreply.github.com"
          git add scan_results.csv candidates.csv
          git commit -m "Daily scan results $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
