name: BTST Scan

# HOW THIS STARTS (the BTST message has to be on your phone in time to act before the 3:30 PM close):
#   1. EXTERNAL TIMER (recommended) - a free cron-job.org job calls GitHub at 2:45 PM IST on weekdays (moved from
#      2:00 PM on 2 Nov 2026), so the run starts on the dot. GitHub's own cron is often hours late.
#      Setup: docs/TIMER_SETUP.md
#   2. The "Run workflow" button here (source = manual) - always runs.
#   3. GitHub's own cron below - kept only as a FALLBACK, set 15 minutes before the timer (2:30 PM IST). If it
#      starts after 3:00 PM IST, or a live BTST scan already ran today, the program skips it on purpose
#      (scanner/runguard.py): a BTST message that late is useless, and the evening Swing scan lists the same
#      stocks anyway. (config.BTST_TIMER_IST, BTST_LATE_CUTOFF_IST and this cron move together; a test checks it.)
#
# SPEED: the evening Swing scan saves a ~100-stock watchlist (data_cache/btst_watchlist.json); this run only
# re-checks those stocks with live prices, which takes minutes instead of the whole market's 10+.

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Limit scan to N symbols for testing'
        required: false
        default: ''
      source:
        description: 'Where this run comes from (leave as manual; the external timer sends "timer")'
        required: false
        type: choice
        options:
          - manual
          - timer
        default: manual
  schedule:
    - cron: '0 9 * * 1-5'    # 2:30 PM IST fallback (09:00 UTC), 15 minutes before the 2:45 PM timer

# One scan at a time across all scan workflows: they share the tracking ledger and data_cache/ files.
concurrency:
  group: scan-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: 'Asia/Kolkata'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Broker Instrument Master Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/angelone
            ./data/*.json
            ./data/*.pkl
          key: angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-${{ github.run_id }}
          restore-keys: |
            angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-
            angelone-instruments-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BTST scan
        env:
          TRADING_RUN_SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.source || 'manual' }}
          TRADING_TEST_LIMIT: ${{ inputs.test_limit }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py scan_btst

      # Index options scan step REMOVED (2026-10-14): the index-instrument fetch never worked reliably and
      # would arrive too late to matter. `python main.py options` still works for manual use.

      - name: Commit BTST reports, scoreboard and data cache
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reports/btst/ reports/output/ tracking/ data_cache/ scan_results_btst.csv summary.md summary_btst.md
          if ! git diff --cached --quiet; then
            git commit -m "Automated BTST scan update $(date -u +%Y-%m-%d)" || echo "No changes to commit"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git merge origin/main --no-edit -X ours -m "Merge remote changes" || true
              if git push origin HEAD:main; then break; fi
              echo "Push attempt $attempt failed - retrying"
              sleep $((attempt * 4))
            done
          else
            echo "No new updates detected for the BTST session."
          fi
