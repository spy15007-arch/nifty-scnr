name: Run All Scans Manual Override

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Limit scan to N symbols for testing (leave blank for full run)'
        required: false
        default: ''

jobs:
  execute-all:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Broker Instrument Master Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/angelone
            ./data/*.json
            ./data/*.pkl
          key: angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-${{ github.run_id }}
          restore-keys: |
            angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-
            angelone-instruments-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Combined Pipeline
        env:
          TRADING_BROKER: angelone
          TRADING_TEST_LIMIT: ${{ inputs.test_limit }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py run_all

      - name: Sync and Commit All Isolated Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
      - name: Archive reports older than 30 days
        run: |
          find reports/morning reports/afternoon reports/eod -name "*.md" -mtime +30 -delete 2>/dev/null || true
          find reports/morning reports/afternoon reports/eod -name "*.csv" -mtime +30 -delete 2>/dev/null || true
          find . -maxdepth 1 -name "scan_results_*.csv" -mtime +30 -delete 2>/dev/null || true
          find . -maxdepth 1 -name "summary_*.md" -mtime +30 -delete 2>/dev/null || truegit add -A reports/morning/* || true
          git add -A reports/afternoon/* || true
          git add -A reports/eod/* || true
          git add -A reports/output/* || true
          git add summary.md || true
          git add scan_results_*.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "Automated scan update $(date -u +%Y-%m-%d)" || echo "No changes to commit"
            git fetch origin main
            git merge origin/main --no-edit -X ours -m "Merge remote changes" || true
            git push origin HEAD:main
          else
            echo "No variations detected."
          fi
