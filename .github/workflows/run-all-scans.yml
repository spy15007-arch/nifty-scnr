name: Run All Scans Manual Override

# Runs the BTST and Swing scans together on one shared download of the market. Use it any time you want both
# lists now. Always runs (source = manual); the second scan lists only stocks the first one did not already pick.

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Limit scan to N symbols for testing (leave blank for full run)'
        required: false
        default: ''

concurrency:
  group: scan-state
  cancel-in-progress: false

jobs:
  execute-all:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: 'Asia/Kolkata'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Broker Instrument Master Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/angelone
            ./data/*.json
            ./data/*.pkl
          key: angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-${{ github.run_id }}
          restore-keys: |
            angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-
            angelone-instruments-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all scans
        env:
          TRADING_RUN_SOURCE: manual
          TRADING_TEST_LIMIT: ${{ inputs.test_limit }}
          TRADING_CAPITAL_INR: ${{ vars.TRADING_CAPITAL_INR }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py run_all

      - name: Commit all scan reports, scoreboard and data cache
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reports/btst/ reports/swing/ reports/output/ tracking/ data_cache/ summary.md summary_btst.md summary_swing.md scan_results_btst.csv scan_results_swing.csv
          if ! git diff --cached --quiet; then
            git commit -m "Automated scan update $(date -u +%Y-%m-%d)" || echo "No changes to commit"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git merge origin/main --no-edit -X ours -m "Merge remote changes" || true
              if git push origin HEAD:main; then break; fi
              echo "Push attempt $attempt failed - retrying"
              sleep $((attempt * 4))
            done
          else
            echo "No variations detected."
          fi
