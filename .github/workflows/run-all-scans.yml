      - name: Sync and Commit All Isolated Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Cleanly stage all dedicated strategy subfolders
          git add -f reports/morning/*.md || true
          git add -f reports/afternoon/*.md || true
          git add -f reports/eod/*.md || true
          git add -f reports/output/*.md || true
          
          if ! git diff --cached --quiet; then
            git commit -m "Master combined pipeline scan $(date -u +%Y-%m-%d) [skip ci]"
            
            # --- THE SELF-CLEANING FIX ---
            # Instantly clears out messy untracked csv files to prevent Git Pull Code 128 crashes
            git checkout -- . || true
            git clean -fdx -e reports/
            
            git fetch origin main
            git pull origin main --rebase
            git push origin HEAD:main
          else
            echo "No new updates detected across any trading session profiles."
          fi
