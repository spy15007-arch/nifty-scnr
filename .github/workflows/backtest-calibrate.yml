name: Backtest & Calibrate

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'backtest = replay the rule on ~3 years of broker data (about 10 minutes); calibrate = live scoreboard report by quality bucket (instant, no broker)'
        required: true
        type: choice
        options:
          - backtest
          - calibrate
        default: 'calibrate'
      scan_mode:
        description: 'Which scan mode to test/calibrate'
        required: true
        type: choice
        options:
          - swing
          - btst
        default: 'swing'
      data_source:
        description: 'backtest only: broker = Angel One daily bars (about 3 years, uses the broker, so do not run it while a scan is running); yahoo = Yahoo Finance (10+ years, split-adjusted, never touches the broker)'
        required: false
        type: choice
        options:
          - broker
          - yahoo
        default: 'broker'
      test_sessions:
        description: 'backtest only: how many of the latest sessions to replay (broker default 250; the yahoo run replays everything it has)'
        required: false
        type: string
        default: ''
      lookback_sessions:
        description: 'backtest only, broker only: daily bars fetched per stock'
        required: false
        type: string
        default: '700'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: 'Asia/Kolkata'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Broker Instrument Master Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/angelone
            ./data/*.json
            ./data/*.pkl
          key: angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-${{ github.run_id }}
          restore-keys: |
            angelone-instruments-${{ secrets.ANGEL_CLIENT_ID }}-
            angelone-instruments-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest or calibrate
        env:
          TRADING_BROKER: angelone
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TRADING_BACKTEST_SOURCE: ${{ inputs.data_source }}
          TRADING_BACKTEST_DAYS: ${{ inputs.test_sessions }}
          TRADING_BACKTEST_LOOKBACK: ${{ inputs.lookback_sessions }}
        run: python main.py ${{ inputs.command }} --calibrate-mode ${{ inputs.scan_mode }}

      - name: Sync and Commit report back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A reports/output/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Backtest/calibrate report $(date -u +%Y-%m-%d)" || echo "No changes to commit"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git merge origin/main --no-edit -X ours -m "Merge remote changes" || true
              if git push origin HEAD:main; then break; fi
              echo "Push attempt $attempt failed - retrying"
              sleep $((attempt * 4))
            done
          else
            echo "No report changes to commit."
          fi
